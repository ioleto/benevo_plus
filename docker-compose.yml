name: benevo-plus
services:
  app:
    build: .
    container_name: benevo-plus
    restart: always
    depends_on:
      db:
        # Le script d'entrée attend réellement PostgreSQL et réessaie aussi
        # les migrations : ne pas bloquer le lancement sur un healthcheck expiré.
        condition: service_started
    environment:
      AUTH_URL: ${AUTH_URL:-https://benevo.ioleto.fr}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET requis}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:?AUTH_GOOGLE_ID requis}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:?AUTH_GOOGLE_SECRET requis}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-${ADMIN_EMAILS:?ADMIN_EMAIL ou ADMIN_EMAILS requis}}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-${ADMIN_EMAIL:?ADMIN_EMAIL ou ADMIN_EMAILS requis}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Bénévo+}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET requis}
      DATABASE_URL: postgresql://${POSTGRES_USER:-benevo}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-benevo}?schema=public
    networks: [internal, swag]
  cron:
    image: curlimages/curl:8.10.1
    container_name: benevo-plus-cron
    restart: always
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do sleep 300; curl -fsS -X POST -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/reminders || true; done"]
    environment:
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET requis}
    depends_on:
      app:
        condition: service_started
    networks: [internal]
  db:
    image: postgres:16-alpine
    container_name: benevo-plus-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-benevo}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]
volumes:
  db-data:
networks:
  internal:
  swag:
    external: true
    name: ${NETWORK_NAME:?NETWORK_NAME requis}
